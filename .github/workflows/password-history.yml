name: Validate password history
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: ['5.65.0', '6.69.1']
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - name: Pin provider schema under test
        env:
          PROVIDER_VERSION: ${{ matrix.provider }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('schema_override.tf').write_text('terraform {\n  required_providers {\n    aws = {\n      source = "hashicorp/aws"\n      version = "' + os.environ['PROVIDER_VERSION'] + '"\n    }\n  }\n}\n')
          PY
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - name: Check password policy without AWS credentials
        run: terraform test -no-color
